name: setlist
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  caddy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging
    depends_on:
      frontend:
        condition: service_healthy
  frontend:
    image: ${FRONTEND_IMAGE:?}
    environment:
      BACKEND_URL: http://api:3000
    ports:
      - '127.0.0.1:8080:80'
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 12
  api:
    image: ${BACKEND_IMAGE:?}
    restart: unless-stopped
    logging: *logging
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      PWA_ORIGIN: ${PWA_ORIGIN:?}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:?Set the production Telegram client ID}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:?Set the production Telegram client secret}
      TELEGRAM_REDIRECT_URI: ${TELEGRAM_REDIRECT_URI:?Set the registered production callback URL}
      AUTH_ALLOW_INSECURE_LOCAL_HTTP: 'false'
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-7776000}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: ${MINIO_BUCKET:-setlist-files}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_MP3_BYTES: ${MAX_MP3_BYTES:-52428800}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 10
  minio-volume-init:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: '0:0'
    entrypoint: ['sh', '-c', 'chown -R 100:101 /data']
    volumes:
      - miniadata:/data
    restart: 'no'
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    logging: *logging
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    command: server /data
    volumes:
      - miniadata:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9000/minio/health/live']
      interval: 5s
      retries: 10
volumes:
  caddy_data:
  caddy_config:
  pgdata:
  miniadata:
