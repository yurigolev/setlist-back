services:
  api:
    image: node:24-alpine
    working_dir: /app
    command: ['node', 'scripts/qa-proxy-server.mjs']
    environment:
      NODE_ENV: test
      PROXY_QA_PROJECT: ${PROXY_QA_PROJECT:?}
    volumes:
      - ../dist:/app/dist:ro
      - ../node_modules:/app/node_modules:ro
      - ./qa-proxy-server.mjs:/app/scripts/qa-proxy-server.mjs:ro
    ports:
      - '127.0.0.1:${PROXY_QA_API_PORT:?}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/qa/client-ip').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./qa-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${PROXY_QA_NGINX_PORT:?}:80'
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      APP_DOMAIN: http://:8080
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config
    depends_on:
      - frontend
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/qa/client-ip']
      interval: 2s
      timeout: 3s
      retries: 30
  client_a:
    image: node:24-alpine
    command: ['node', '-e', 'setInterval(()=>{}, 1000)']
  client_b:
    image: node:24-alpine
    command: ['node', '-e', 'setInterval(()=>{}, 1000)']
