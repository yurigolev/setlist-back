services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_QA_DATABASE_NAME:?}
      POSTGRES_USER: ${AUTH_QA_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${AUTH_QA_POSTGRES_PASSWORD:?}
    ports:
      - '127.0.0.1:${AUTH_QA_PG_PORT:?}:5432'
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AUTH_QA_MINIO_USER:?}
      MINIO_ROOT_PASSWORD: ${AUTH_QA_MINIO_PASSWORD:?}
    ports:
      - '127.0.0.1:${AUTH_QA_MINIO_PORT:?}:9000'
    tmpfs:
      - /data:size=512m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 2s
      retries: 30
